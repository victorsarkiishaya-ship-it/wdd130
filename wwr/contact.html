
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Exciting Expeditions White Water Rafting</title>

    <meta name="description" content="Get in touch with Exciting Expeditions. Contact us for questions, bookings, or more information about our white water rafting adventures.">

    <meta name="author" content="Victor Ishaya">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="Exciting Expeditions Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <!-- Company Information -->
        <section class="company-info-section">

            <h1>Contact Exciting Expeditions</h1>

            <div class="company-details">

                <h2>Exciting Expeditions</h2>

                <p>123 Main Street<br>
                Boise, Idaho, USA</p>

                <p>+1 (555) 555-5555</p>

                <p>info@excitingexpeditions.com</p>

            </div>

        </section>

        <!-- Map and Contact Form -->
        <section class="map-form-section">

            <div class="map-container">

                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3056.711833543884!2d-116.2023143234796!3d43.61501397110196!2m3!f0!3f0!0f0!3m2!1f1024!2i768!4f13.1!3m3!1m2!1s0x54ee5147820b4a53%3A0x8a7051412d0ff52d!2sBoise%2C%20ID!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus"
                    loading="lazy"
                    title="Exciting Expeditions Location Map">
                </iframe>

            </div>

            <div class="form-section">

                <form action="#" method="post">

                    <fieldset>

                        <legend>Send Us a Message</legend>

                        <div class="form-item">

                            <label for="name">Name:</label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                required
                                placeholder="Enter your full name">

                        </div>

                        <div class="form-item">

                            <label for="email">Email:</label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                required
                                placeholder="Enter your email address">

                        </div>

                        <div class="form-item">

                            <p>Purpose of Message:</p>

                            <div class="radio-group">

                                <label for="purpose-general">
                                    <input
                                        type="radio"
                                        id="purpose-general"
                                        name="purpose"
                                        value="general"
                                        checked>
                                    General Inquiry
                                </label>

                                <label for="purpose-reservation">
                                    <input
                                        type="radio"
                                        id="purpose-reservation"
                                        name="purpose"
                                        value="reservation">
                                    Reservation Question
                                </label>

                                <label for="purpose-suggestion">
                                    <input
                                        type="radio"
                                        id="purpose-suggestion"
                                        name="purpose"
                                        value="suggestion">
                                    Website Suggestion
                                </label>

                            </div>

                        </div>

                        <div class="form-item">

                            <label for="message">Message:</label>

                            <textarea
                                id="message"
                                name="message"
                                rows="4"
                                required
                                placeholder="Write your message here"></textarea>

                        </div>

                        <div class="form-item checkbox-item">

                            <label for="newsletter">
                                <input
                                    type="checkbox"
                                    id="newsletter"
                                    name="newsletter"
                                    value="yes">
                                Please subscribe me to the monthly newsletter
                            </label>

                        </div>

                    </fieldset>

                    <button type="submit" class="submit-btn">
                        Get in Touch!
                    </button>

                </form>

            </div>

        </section>

        <!-- Employee Profiles -->
        <section class="employee-section">

            <h2>Meet Our Team</h2>

            <div class="employee-grid">

                <figure>
                    <img
                        src="images/happy_employee.jpg"
                        alt="Rafting guide smiling">
                    <figcaption>Our Friendly Rafting Guide</figcaption>
                </figure>

                <figure>
                    <img
                        src="images/history.jpg"
                        alt="Exciting Expeditions team on the river">
                    <figcaption>Our Adventure Team</figcaption>
                </figure>

                <figure>
                    <img
                        src="images/rafting3.jpg"
                        alt="Rafting group enjoying a river adventure">
                    <figcaption>Our Rafting Adventures</figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>&copy; 2026 Exciting Expeditions | Victor Ishaya</p>

        <nav class="socialmedia">

            <a href="https://facebook.com"
               target="_blank"
               rel="noopener noreferrer">
                <img src="images/facebook.png" alt="Facebook">
            </a>

            <a href="https://twitter.com"
               target="_blank"
               rel="noopener noreferrer">
                <img src="images/twitter.png" alt="Twitter">
            </a>

            <a href="https://instagram.com"
               target="_blank"
               rel="noopener noreferrer">
                <img src="images/instagram.png" alt="Instagram">
            </a>

        </nav>

    </footer>

</body>
</html>
